  <div class="modal-overlay" id="modal-cert-edit">
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title">Edit Certificate</span>
        <button class="modal-close" onclick="closeModal('modal-cert-edit')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form class="modal-form" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mf-group">
          <label for="ce_title">Certificate Title</label>
          <input id="ce_title" type="text" name="title" placeholder="e.g. Python for Everybody" required />
        </div>
        <div class="mf-group">
          <label for="ce_issuer">Issuing Organisation</label>
          <input id="ce_org" type="text" name="org" placeholder="e.g. Coursera / Google / ICPC" />
        </div>
        <div class="mf-row">
          <div class="mf-group">
            <label for="ce_issued">Issue Date</label>
            <input id="ce_issued" type="text" name="issue_date" placeholder="e.g. Oct 2024" />
          </div>
          <div class="mf-group">
            <label for="ce_expires">Expiry</label>
            <input id="ce_expires" type="text" name="expiry_date" placeholder="e.g. No Expiry" />
          </div>
        </div>
        <div class="mf-group">
          <label for="ce_url">Certificate URL</label>
          <input id="ce_url" type="url" name="certificate" placeholder="https://..." />
        </div>
        <div class="modal-footer">
          <button type="button" class="modal-cancel" onclick="closeModal('modal-cert-edit')">Cancel</button>
          <button type="submit" class="modal-save">Save Changes</button>
        </div>
      </form>
    </div>
  </div>
